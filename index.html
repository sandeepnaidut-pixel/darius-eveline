<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding Darius & Eveline</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 375px; 
            height: 667px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border: 4px solid #444;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        /* Adds a retro striped wallpaper */
        #wall {
            width: 100%;
            height: 60%;
            position: absolute;
            top: 0;
            background: repeating-linear-gradient(
                45deg,
                #f8ecee,
                #f8ecee 10px,
                #fdf5f6 10px,
                #fdf5f6 20px
            );
        }

        /* Creates a 3D floor perspective */
        #floor {
            width: 100%;
            height: 40%;
            position: absolute;
            bottom: 0;
            background-color: #e3d5ca;
            border-top: 4px solid #c7b5a7;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
            cursor: pointer;
        }

        /* Resized and layered elements for realistic depth */
        #drums { 
            bottom: 35%; 
            left: 2%; 
            width: 130px; 
            z-index: 5; /* Sits behind the couple */
        }

        #couple { 
            bottom: 15%; 
            left: 50%; 
            width: 230px; 
            z-index: 10; /* Sits in the middle */
        }
        
        #cake { 
            bottom: 25%; 
            right: 8%; 
            width: 80px; 
            z-index: 15; /* Sits in front of the couple */
        }
        
        #cats { 
            bottom: 5%; 
            left: 25%; 
            width: 60px; 
            z-index: 20; /* Sits in the very front */
        }

        #dialogue-box {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 90px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            padding: 12px;
            box-sizing: border-box;
            z-index: 30;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
        }

        #speaker-name {
            color: #f9a826;
            font-size: 11px;
            margin-bottom: 12px;
            text-shadow: 1px 1px 0px #000;
        }

        #dialogue-text {
            font-size: 11px;
            line-height: 1.6;
        }

        /* Subtle breathing animation for the couple */
        @keyframes idle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }
        .idle-anim { animation: idle 3s infinite ease-in-out; }

        /* Click bounce animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes bounce-center {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-12px); }
        }
        .bounce { animation: bounce 0.3s ease; }
        .bounce-center { animation: bounce-center 0.3s ease; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="wall"></div>
        <div id="floor"></div>
        
        <img src="drums.png" class="sprite" id="drums" alt="Drums">
        <img src="cake.png" class="sprite" id="cake" alt="Wedding Cake">
        <img src="cats.png" class="sprite" id="cats" alt="Cats">
        <img src="couple.png" class="sprite idle-anim" id="couple" alt="Darius and Eveline">

        <div id="dialogue-box">
            <div id="speaker-name">San</div>
            <div id="dialogue-text"></div>
        </div>
    </div>

    <script>
        // RPG Typing Effect
        const textToType = "Happy wedding!";
        const textElement = document.getElementById('dialogue-text');
        let textIndex = 0;

        function typeWriter() {
            if (textIndex < textToType.length) {
                textElement.innerHTML += textToType.charAt(textIndex);
                textIndex++;
                setTimeout(typeWriter, 70); // Adjust typing speed here
            }
        }
        
        // Start typing after a short delay
        setTimeout(typeWriter, 500);

        // Click Animations
        const sprites = document.querySelectorAll('.sprite');

        function triggerBounce(element, isCenter) {
            const animationClass = isCenter ? 'bounce-center' : 'bounce';
            element.classList.remove(animationClass);
            void element.offsetWidth; 
            element.classList.add(animationClass);
        }

        sprites.forEach(sprite => {
            sprite.addEventListener('click', () => {
                const isCenter = sprite.id === 'couple';
                triggerBounce(sprite, isCenter);
            });
        });
    </script>

</body>
</html>
