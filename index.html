<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding Darius & Eveline</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 375px; 
            height: 667px;
            background-color: #fdfaf6;
            position: relative;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        /* Soft striped wallpaper */
        #wall {
            width: 100%;
            height: 65%;
            position: absolute;
            top: 0;
            background: repeating-linear-gradient(
                45deg,
                #fdf8f9,
                #fdf8f9 15px,
                #ffffff 15px,
                #ffffff 30px
            );
        }

        /* Glowing Fairy Lights */
        .glow-light {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #fffacd;
            border-radius: 50%;
            box-shadow: 0 0 10px 4px rgba(255, 250, 205, 0.6);
            animation: pulse 3s infinite alternate;
        }

        /* Beautiful Floral Banner */
        #banner {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: linear-gradient(to right, #ffffff, #fcfcfc);
            border: 2px solid #e5c158;
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
            color: #4a4a4a;
            font-size: 13px;
            z-index: 10;
            box-shadow: 0px 4px 10px rgba(229, 193, 88, 0.2);
            line-height: 1.4;
        }
        
        .flower {
            color: #ff9fb4;
            font-size: 14px;
        }

        /* Light Grey Carpet */
        #carpet {
            width: 100%;
            height: 35%;
            position: absolute;
            bottom: 0;
            background-color: #e8e9eb;
            border-top: 3px solid #d1d3d6;
            z-index: 2;
        }

        /* Dais Platform */
        #dais {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 40px;
            background-color: #ffffff;
            border: 2px solid #dcdcdc;
            border-bottom: 6px solid #cccccc;
            border-radius: 20px 20px 0 0;
            z-index: 5;
        }

        /* Table in Front */
        #table {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-bottom: 4px solid #d3d3d3;
            z-index: 25;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
            cursor: pointer;
        }

        #drums { 
            bottom: 28%; 
            left: -2%; 
            width: 100px; 
            z-index: 4; 
        }

        #couple { 
            bottom: 26%; 
            left: 50%; 
            width: 210px; 
            z-index: 15; 
            transform: translateX(-50%);
        }
        
        /* Container for Cake and Candles */
        #cake-container {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 90px;
            z-index: 30;
            cursor: pointer;
        }

        #cake {
            width: 100%;
            position: absolute;
            bottom: 0;
        }

        /* Candles */
        .candle {
            position: absolute;
            width: 4px;
            height: 12px;
            background-color: #fdfdfd;
            border-left: 1px solid #ccc;
            z-index: 31;
        }
        .flame {
            position: absolute;
            top: -8px;
            left: -1px;
            width: 6px;
            height: 8px;
            background-color: #ffb703;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.4s infinite alternate;
        }

        #cats { 
            bottom: 5%; 
            left: 10%; 
            width: 65px; 
            z-index: 35; 
        }

        /* Dynamic Dialogue Box */
        #dynamic-dialogue {
            position: absolute;
            top: 25%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #e5c158;
            border-radius: 8px;
            color: #333;
            padding: 12px;
            box-sizing: border-box;
            z-index: 50;
            font-size: 10px;
            line-height: 1.6;
            text-align: center;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            top: -10px;
            z-index: 100;
            animation: fall linear forwards;
        }

        /* Keyframes */
        @keyframes fall {
            to { transform: translateY(700px) rotate(360deg); }
        }

        @keyframes pulse {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.1); }
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.8; }
        }

        @keyframes idle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-2px); }
        }
        .idle-anim { animation: idle 3.5s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes bounce-center {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        .bounce { animation: bounce 0.3s ease; }
        .bounce-center { animation: bounce-center 0.3s ease; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="wall"></div>
        
        <!-- Glowing Lights -->
        <div class="glow-light" style="top: 15%; left: 15%;"></div>
        <div class="glow-light" style="top: 25%; left: 85%;"></div>
        <div class="glow-light" style="top: 35%; left: 10%;"></div>
        <div class="glow-light" style="top: 45%; left: 80%;"></div>

        <div id="banner">
            <span class="flower">✿</span> HAPPY WEDDING <span class="flower">✿</span>
        </div>
        
        <div id="carpet"></div>
        <div id="dais"></div>
        <div id="table"></div>
        
        <img src="drums.png" class="sprite" id="drums" alt="Drums">
        <img src="cats.png" class="sprite" id="cats" alt="Cats">
        <img src="couple.png" class="sprite idle-anim" id="couple" alt="Darius and Eveline">

        <div id="cake-container">
            <img src="cake.png" id="cake" alt="Wedding Cake">
            <!-- Positioned candles on top of the cake -->
            <div class="candle" style="left: 30px; bottom: 65px;"><div class="flame"></div></div>
            <div class="candle" style="left: 40px; bottom: 75px;"><div class="flame"></div></div>
            <div class="candle" style="left: 50px; bottom: 65px;"><div class="flame"></div></div>
        </div>

        <div id="dynamic-dialogue"></div>
    </div>

    <script>
        const dialogueBox = document.getElementById('dynamic-dialogue');
        let typeTimeout;
        let hideTimeout;

        function showDialogue(text) {
            dialogueBox.style.display = 'block';
            dialogueBox.innerHTML = '';
            
            clearTimeout(typeTimeout);
            clearTimeout(hideTimeout);
            
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    dialogueBox.innerHTML += text.charAt(i);
                    i++;
                    typeTimeout = setTimeout(typeWriter, 50);
                } else {
                    hideTimeout = setTimeout(() => {
                        dialogueBox.style.display = 'none';
                    }, 4000);
                }
            }
            typeWriter();
        }

        function triggerBounce(element, isCenter) {
            const animationClass = isCenter ? 'bounce-center' : 'bounce';
            element.classList.remove(animationClass);
            void element.offsetWidth; 
            element.classList.add(animationClass);
        }

        function throwConfetti() {
            const colors = ['#ff9fb4', '#e5c158', '#ffffff', '#a8e6cf'];
            for (let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + '%';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                document.getElementById('game-container').appendChild(conf);
                
                // Cleanup DOM
                setTimeout(() => conf.remove(), 3000);
            }
        }

        // Interactions
        document.getElementById('cats').addEventListener('click', () => {
            showDialogue('meow, meow, Darius & Eveline <3');
            triggerBounce(document.getElementById('cats'), false);
        });

        document.getElementById('drums').addEventListener('click', () => {
            showDialogue('da dum tssss.. congrats!!');
            triggerBounce(document.getElementById('drums'), false);
        });

        document.getElementById('cake-container').addEventListener('click', () => {
            const flames = document.querySelectorAll('.flame');
            flames.forEach(flame => flame.style.display = 'none');
            triggerBounce(document.getElementById('cake-container'), true);
        });

        document.getElementById('couple').addEventListener('click', () => {
            throwConfetti();
            triggerBounce(document.getElementById('couple'), true);
        });
    </script>

</body>
</html>
