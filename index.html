<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding Darius & Eveline</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 375px; 
            height: 667px;
            background-color: #fdfaf6;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 12px;
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.4);
        }

        #wall {
            width: 100%;
            height: 70%;
            position: absolute;
            top: 0;
            background: repeating-linear-gradient(
                45deg,
                #fff0f5,
                #fff0f5 20px,
                #ffe4e1 20px,
                #ffe4e1 40px
            );
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px 3px #fffacd;
            animation: twinkle 4s infinite ease-in-out;
        }

        #banner {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ffb6c1;
            border-radius: 20px;
            padding: 15px 10px;
            text-align: center;
            color: #d87093;
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            z-index: 10;
            box-shadow: 0px 6px 15px rgba(255, 182, 193, 0.4);
        }
        
        .flower {
            color: #ff9fb4;
            font-size: 22px;
            vertical-align: middle;
        }

        #carpet {
            width: 100%;
            height: 30%;
            position: absolute;
            bottom: 0;
            background-color: #f0f0f0;
            border-top: 4px solid #e0e0e0;
            z-index: 2;
        }

        #dais {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            z-index: 5;
        }

        #table {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 45px;
            background-color: #ffffff;
            border-radius: 8px;
            z-index: 25;
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
            border-bottom: 5px solid #f5f5f5;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
            cursor: pointer;
        }

        #drums { bottom: 25%; left: 2%; width: 100px; z-index: 8; }
        #couple { bottom: 25%; left: 50%; width: 230px; z-index: 15; transform: translateX(-50%); }
        #cats { bottom: 3%; left: 10%; width: 65px; z-index: 35; }
        #book {
            bottom: 12%; 
            left: 32%; 
            width: 50px; 
            z-index: 30; 
            filter: sepia(0.8) hue-rotate(-30deg) saturate(1.5) brightness(0.9);
        }

        /* Floating Balloons */
        .balloon {
            width: 45px;
            z-index: 14; /* Sits just behind the archway */
            animation: float 4s infinite ease-in-out;
        }
        #balloon-left { bottom: 48%; left: 18%; animation-delay: 0s; }
        #balloon-right { bottom: 50%; right: 18%; animation-delay: 2s; }

        #cake-container {
            position: absolute;
            bottom: 11%; 
            left: 55%; 
            width: 75px;
            height: 80px;
            z-index: 30;
            cursor: pointer;
        }
        #cake { width: 100%; position: absolute; bottom: 0; }

        .candle {
            position: absolute;
            width: 4px;
            height: 14px;
            background-color: #fff;
            border-left: 1px solid #ccc;
            z-index: 31;
        }
        .flame {
            position: absolute;
            top: -10px;
            left: -1px;
            width: 6px;
            height: 10px;
            background-color: #ffb703;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.3s infinite alternate;
            box-shadow: 0 0 5px #ffb703;
        }

        #dynamic-dialogue {
            position: absolute;
            top: 25%; 
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background-color: rgba(255, 255, 255, 0.98);
            border: 3px solid #ffb6c1;
            border-radius: 12px;
            color: #555;
            padding: 15px;
            box-sizing: border-box;
            z-index: 50;
            font-size: 10px;
            line-height: 1.8;
            text-align: center;
            display: none;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.5);
        }

        /* Confetti and Drumsticks */
        .confetti {
            position: absolute;
            width: 7px;
            height: 7px;
            top: -10px;
            z-index: 100;
            animation: fall linear forwards;
            border-radius: 2px;
        }

        .drumstick {
            position: absolute;
            width: 5px;
            height: 35px;
            background-color: #c29b62;
            border-radius: 5px;
            top: -40px;
            z-index: 100;
            animation: fall-stick linear forwards;
            box-shadow: inset -2px 0 0 rgba(0,0,0,0.2);
        }

        @keyframes fall {
            to { transform: translateY(700px) rotate(720deg); }
        }
        
        @keyframes fall-stick {
            to { transform: translateY(700px) rotate(1440deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.7; }
        }

        @keyframes idle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }
        .idle-anim { animation: idle 3s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes bounce-center {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        .bounce { animation: bounce 0.3s ease; }
        .bounce-center { animation: bounce-center 0.3s ease; }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Hidden Audio Player -->
        <audio id="bg-music" src="song.mp3" loop></audio>

        <div id="wall"></div>
        
        <div class="sparkle" style="top: 20%; left: 15%; animation-delay: 0s;"></div>
        <div class="sparkle" style="top: 30%; left: 85%; animation-delay: 1s;"></div>
        <div class="sparkle" style="top: 45%; left: 10%; animation-delay: 2s;"></div>
        <div class="sparkle" style="top: 50%; left: 80%; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="top: 15%; left: 50%; animation-delay: 1.5s;"></div>

        <div id="banner">
            <span class="flower">✿</span> Happy Wedding <span class="flower">✿</span>
        </div>
        
        <div id="carpet"></div>
        <div id="dais"></div>
        <div id="table"></div>
        
        <img src="drums.png" class="sprite" id="drums" alt="Drums">
        <img src="cats.png" class="sprite" id="cats" alt="Cats">
        <img src="couple.png" class="sprite idle-anim" id="couple" alt="Darius and Eveline">
        <img src="book.png" class="sprite" id="book" alt="Bible">
        
        <!-- Floating Balloons -->
        <img src="balloon.png" class="sprite balloon" id="balloon-left" alt="Balloon">
        <img src="balloon.png" class="sprite balloon" id="balloon-right" alt="Balloon">

        <div id="cake-container">
            <img src="cake.png" id="cake" alt="Wedding Cake">
            <div class="candle" style="left: 28px; bottom: 60px;"><div class="flame"></div></div>
            <div class="candle" style="left: 36px; bottom: 70px;"><div class="flame"></div></div>
            <div class="candle" style="left: 44px; bottom: 60px;"><div class="flame"></div></div>
        </div>

        <div id="dynamic-dialogue"></div>
    </div>

    <script>
        const dialogueBox = document.getElementById('dynamic-dialogue');
        let typeTimeout;
        let hideTimeout;
        let audioStarted = false;

        // Start background music on the very first tap anywhere on the screen
        document.body.addEventListener('click', () => {
            if (!audioStarted) {
                const bgMusic = document.getElementById('bg-music');
                bgMusic.play().catch(error => console.log("Audio requires user interaction first."));
                audioStarted = true;
            }
        });

        function showDialogue(text) {
            dialogueBox.style.display = 'block';
            dialogueBox.innerHTML = '';
            clearTimeout(typeTimeout);
            clearTimeout(hideTimeout);
            
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    dialogueBox.innerHTML += text.charAt(i);
                    i++;
                    typeTimeout = setTimeout(typeWriter, 40);
                } else {
                    hideTimeout = setTimeout(() => {
                        dialogueBox.style.display = 'none';
                    }, 5000);
                }
            }
            typeWriter();
        }

        function triggerBounce(element, isCenter) {
            const animationClass = isCenter ? 'bounce-center' : 'bounce';
            element.classList.remove(animationClass);
            void element.offsetWidth; 
            element.classList.add(animationClass);
        }

        function throwConfetti() {
            const colors = ['#ffb6c1', '#ffc0cb', '#fffacd', '#e6e6fa', '#ffffff'];
            for (let i = 0; i < 50; i++) {
                let conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + '%';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                document.getElementById('game-container').appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }
        }

        function throwDrumsticks() {
            for (let i = 0; i < 30; i++) {
                let stick = document.createElement('div');
                stick.classList.add('drumstick');
                stick.style.left = Math.random() * 100 + '%';
                stick.style.animationDuration = (Math.random() * 1.5 + 1.0) + 's';
                document.getElementById('game-container').appendChild(stick);
                setTimeout(() => stick.remove(), 2500);
            }
        }

        document.getElementById('book').addEventListener('click', () => {
            showDialogue('Colossians 3:14: "And over all these virtues put on love, which binds them all together in perfect unity."');
            triggerBounce(document.getElementById('book'), false);
        });

        document.getElementById('cats').addEventListener('click', () => {
            showDialogue('meow, meow, Darius & Eveline <3');
            triggerBounce(document.getElementById('cats'), false);
        });

        // Easter Egg Logic for the Drums
        let drumClicks = 0;
        let drumTimer;

        document.getElementById('drums').addEventListener('click', () => {
            triggerBounce(document.getElementById('drums'), false);
            drumClicks++;
            clearTimeout(drumTimer);

            if (drumClicks >= 5) {
                showDialogue('DA DUM TSSSS! DRUM SOLO!');
                throwDrumsticks();
                drumClicks = 0; 
            } else {
                showDialogue('da dum tssss.. congrats!!');
                // Reset the count if they stop clicking for 2 seconds
                drumTimer = setTimeout(() => { drumClicks = 0; }, 2000);
            }
        });

        document.getElementById('cake-container').addEventListener('click', () => {
            const flames = document.querySelectorAll('.flame');
            flames.forEach(flame => flame.style.display = 'none');
            triggerBounce(document.getElementById('cake-container'), false);
        });

        document.getElementById('couple').addEventListener('click', () => {
            throwConfetti();
            triggerBounce(document.getElementById('couple'), true);
        });
    </script>

</body>
</html>
