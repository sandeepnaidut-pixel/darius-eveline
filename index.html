<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding Darius & Eveline</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 375px; 
            height: 667px;
            background-color: #fdfaf6;
            position: relative;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        /* Striped Wallpaper */
        #wall {
            width: 100%;
            height: 70%;
            position: absolute;
            top: 0;
            background: repeating-linear-gradient(
                45deg,
                #f8ecee,
                #f8ecee 15px,
                #fdf5f6 15px,
                #fdf5f6 30px
            );
        }

        /* Wedding Banner */
        #banner {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background-color: #ffffff;
            border: 3px solid #d4af37;
            padding: 12px 0;
            text-align: center;
            color: #333;
            font-size: 14px;
            z-index: 10;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        
        .flower {
            color: #ff8da1;
        }

        /* Wooden Stage */
        #stage {
            width: 100%;
            height: 35%;
            position: absolute;
            bottom: 10%; /* Sits just above the audience */
            background: repeating-linear-gradient(
                90deg,
                #d2b48c,
                #d2b48c 25px,
                #c4a47c 25px,
                #c4a47c 50px
            );
            border-top: 6px solid #b3926a;
            z-index: 2;
        }

        /* Table for the Cake */
        #table {
            position: absolute;
            bottom: 27%;
            right: 8%;
            width: 75px;
            height: 45px;
            background-color: #ffffff;
            border: 2px solid #dcdcdc;
            border-bottom: 6px solid #cccccc;
            z-index: 12;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* Audience Silhouettes */
        #audience {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10%;
            background: #111;
            /* Creates rounded heads across the bottom edge */
            background-image: radial-gradient(circle at 20px 0, #222 20px, transparent 21px);
            background-size: 40px 20px;
            background-repeat: repeat-x;
            z-index: 30;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
            cursor: pointer;
        }

        /* Layered Element Sizing and Positioning */
        #drums { 
            bottom: 28%; 
            left: 3%; 
            width: 110px; 
            z-index: 10; 
        }

        #couple { 
            bottom: 24%; 
            left: 50%; 
            width: 210px; 
            z-index: 15; 
            transform: translateX(-50%);
        }
        
        #cake { 
            bottom: 35%; /* Sits above the table */
            right: 8%; 
            width: 75px; 
            z-index: 16; 
        }
        
        #cats { 
            bottom: 15%; 
            left: 20%; 
            width: 65px; 
            z-index: 20; 
        }

        /* Dynamic Dialogue Box */
        #dynamic-dialogue {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background-color: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            padding: 12px;
            box-sizing: border-box;
            z-index: 40;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
            display: none; /* Hidden until clicked */
        }

        /* Animations */
        @keyframes idle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }
        .idle-anim { animation: idle 3s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes bounce-center {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-12px); }
        }
        .bounce { animation: bounce 0.3s ease; }
        .bounce-center { animation: bounce-center 0.3s ease; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="wall"></div>
        <div id="banner">
            <span class="flower">*</span> HAPPY WEDDING <span class="flower">*</span>
        </div>
        <div id="stage"></div>
        <div id="table"></div>
        <div id="audience"></div>
        
        <img src="drums.png" class="sprite" id="drums" alt="Drums">
        <img src="cake.png" class="sprite" id="cake" alt="Wedding Cake">
        <img src="cats.png" class="sprite" id="cats" alt="Cats">
        <img src="couple.png" class="sprite idle-anim" id="couple" alt="Darius and Eveline">

        <div id="dynamic-dialogue"></div>
    </div>

    <script>
        const dialogueBox = document.getElementById('dynamic-dialogue');
        let typeTimeout;
        let hideTimeout;

        function showDialogue(text) {
            dialogueBox.style.display = 'block';
            dialogueBox.innerHTML = '';
            
            clearTimeout(typeTimeout);
            clearTimeout(hideTimeout);
            
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    dialogueBox.innerHTML += text.charAt(i);
                    i++;
                    typeTimeout = setTimeout(typeWriter, 50);
                } else {
                    hideTimeout = setTimeout(() => {
                        dialogueBox.style.display = 'none';
                    }, 4000); // Hides box after 4 seconds
                }
            }
            typeWriter();
        }

        // Add interaction logic
        document.getElementById('cats').addEventListener('click', () => {
            showDialogue('meow meow');
            triggerBounce(document.getElementById('cats'), false);
        });

        document.getElementById('drums').addEventListener('click', () => {
            showDialogue('da dum tssss.. congrats!!');
            triggerBounce(document.getElementById('drums'), false);
        });

        document.getElementById('cake').addEventListener('click', () => {
            triggerBounce(document.getElementById('cake'), false);
        });

        document.getElementById('couple').addEventListener('click', () => {
            triggerBounce(document.getElementById('couple'), true);
        });

        function triggerBounce(element, isCenter) {
            const animationClass = isCenter ? 'bounce-center' : 'bounce';
            element.classList.remove(animationClass);
            void element.offsetWidth; 
            element.classList.add(animationClass);
        }
    </script>

</body>
</html>
