<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding Darius & Eveline</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 375px; 
            height: 667px;
            background-color: #fce4ec;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 12px;
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.4);
        }

        /* Pink and Purple Pastel Wallpaper */
        #wall {
            width: 100%;
            height: 70%;
            position: absolute;
            top: 0;
            background: repeating-linear-gradient(
                45deg,
                #fce4ec,
                #fce4ec 20px,
                #f3e5f5 20px,
                #f3e5f5 40px
            );
        }

        /* String Lights */
        .light-wire {
            position: absolute;
            top: 15px;
            left: -5%;
            width: 110%;
            height: 40px;
            border-bottom: 2px solid #bcaaa4;
            border-radius: 50%;
            z-index: 5;
        }

        .bulb {
            position: absolute;
            top: 50px;
            width: 10px;
            height: 10px;
            background-color: #fff9c4;
            border-radius: 50%;
            box-shadow: 0 0 12px 6px rgba(255, 235, 59, 0.6);
            z-index: 6;
            animation: pulse-light 1.5s infinite alternate;
        }

        /* Magical Floating Sparkles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px 3px #fffacd;
            animation: twinkle 4s infinite ease-in-out;
            z-index: 4;
        }

        /* Pixel Style Glowing Banner */
        #banner {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #f48fb1;
            border-radius: 16px;
            padding: 12px 5px;
            text-align: center;
            color: #ffa6c9;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.9), 0 0 20px rgba(255, 105, 180, 0.6);
            font-family: 'Press Start 2P', cursive;
            font-size: 10px; /* Reduced to fit the names */
            line-height: 1.8;
            z-index: 10;
            box-shadow: 0px 6px 15px rgba(244, 143, 177, 0.4);
        }

        /* Lavender Carpet */
        #carpet {
            width: 100%;
            height: 28%;
            position: absolute;
            bottom: 0;
            background-color: #e1bee7;
            border-top: 4px solid #ce93d8;
            z-index: 2;
        }

        /* Dais */
        #dais {
            position: absolute;
            bottom: 24%;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            height: 35px;
            background-color: #fff0f5;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            border: 1px solid #f8bbd0;
            z-index: 5;
        }

        /* Table */
        #table {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 45px;
            background-color: #fff0f5;
            border-radius: 8px;
            z-index: 25;
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
            border-bottom: 5px solid #f8bbd0;
            border-left: 1px solid #f8bbd0;
            border-right: 1px solid #f8bbd0;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
            cursor: pointer;
            transform: translateX(-50%);
        }

        #couple { bottom: 25%; left: 50%; width: 230px; z-index: 15; }
        #drums { bottom: 25%; left: 16%; width: 95px; z-index: 14; }
        #cats { bottom: 25%; left: 84%; width: 60px; z-index: 16; }
        
        #book {
            bottom: 12%; 
            left: 38%; 
            width: 45px; 
            z-index: 30; 
            filter: sepia(0.8) hue-rotate(-30deg) saturate(1.5) brightness(0.9);
        }

        #cake-container {
            position: absolute;
            bottom: 12%; 
            left: 62%; 
            transform: translateX(-50%);
            width: 60px;
            height: 70px;
            z-index: 30;
            cursor: pointer;
        }
        
        #cake { width: 100%; position: absolute; bottom: 0; }

        .candle {
            position: absolute;
            width: 3px;
            height: 12px;
            background-color: #fff;
            border-left: 1px solid #ccc;
            z-index: 31;
        }
        .flame {
            position: absolute;
            top: -8px;
            left: -1px;
            width: 5px;
            height: 8px;
            background-color: #ffb703;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.3s infinite alternate;
            box-shadow: 0 0 5px #ffb703;
        }

        /* Dialogue Box */
        #dynamic-dialogue {
            position: absolute;
            bottom: 4%; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background-color: rgba(255, 255, 255, 0.98);
            border: 3px solid #ce93d8;
            border-radius: 12px;
            color: #4a148c;
            padding: 12px;
            box-sizing: border-box;
            z-index: 200; 
            font-size: 9px;
            line-height: 1.6;
            text-align: center;
            display: none;
            box-shadow: 0 8px 20px rgba(206, 147, 216, 0.5);
        }

        .confetti {
            position: absolute;
            width: 7px;
            height: 7px;
            top: -10px;
            z-index: 100;
            animation: fall linear forwards;
            border-radius: 2px;
        }

        .drumstick {
            position: absolute;
            width: 5px;
            height: 35px;
            background-color: #c29b62;
            border-radius: 5px;
            top: -40px;
            z-index: 100;
            animation: fall-stick linear forwards;
            box-shadow: inset -2px 0 0 rgba(0,0,0,0.2);
        }

        @keyframes fall {
            to { transform: translateY(700px) rotate(720deg); }
        }
        
        @keyframes fall-stick {
            to { transform: translateY(700px) rotate(1440deg); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        @keyframes pulse-light {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.7; }
        }

        @keyframes idle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }
        .idle-anim { animation: idle 3s infinite ease-in-out; }

        @keyframes bounce-center {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        .bounce-center { animation: bounce-center 0.3s ease; }

    </style>
</head>
<body>

    <div id="game-container">
        <audio id="bg-music" src="song.mp3" loop></audio>

        <div id="wall"></div>
        
        <!-- String Lights -->
        <div class="light-wire"></div>
        <div class="bulb" style="left: 10%;"></div>
        <div class="bulb" style="left: 30%;"></div>
        <div class="bulb" style="left: 50%;"></div>
        <div class="bulb" style="left: 70%;"></div>
        <div class="bulb" style="left: 90%;"></div>
        
        <div class="sparkle" style="top: 30%; left: 15%; animation-delay: 0s;"></div>
        <div class="sparkle" style="top: 40%; left: 85%; animation-delay: 1s;"></div>
        <div class="sparkle" style="top: 45%; left: 10%; animation-delay: 2s;"></div>
        <div class="sparkle" style="top: 50%; left: 80%; animation-delay: 0.5s;"></div>

        <div id="banner">
            ~ HAPPY WEDDING ~<br>DARIUS & EVELINE
        </div>
        
        <div id="carpet"></div>
        <div id="dais"></div>
        <div id="table"></div>
        
        <img src="drums.png" class="sprite" id="drums" alt="Drums">
        <img src="cats.png" class="sprite" id="cats" alt="Cats">
        <img src="couple.png" class="sprite idle-anim" id="couple" alt="Darius and Eveline">
        <img src="book.png" class="sprite" id="book" alt="Bible">
        
        <div id="cake-container">
            <img src="cake.png" id="cake" alt="Wedding Cake">
            <div class="candle" style="left: 20px; bottom: 48px;"><div class="flame"></div></div>
            <div class="candle" style="left: 28px; bottom: 58px;"><div class="flame"></div></div>
            <div class="candle" style="left: 36px; bottom: 48px;"><div class="flame"></div></div>
        </div>

        <div id="dynamic-dialogue"></div>
    </div>

    <script>
        const dialogueBox = document.getElementById('dynamic-dialogue');
        let typeTimeout;
        let hideTimeout;
        let audioStarted = false;

        document.body.addEventListener('click', () => {
            if (!audioStarted) {
                const bgMusic = document.getElementById('bg-music');
                bgMusic.play().catch(error => console.log("Audio requires user interaction first."));
                audioStarted = true;
            }
        });

        function showDialogue(text) {
            dialogueBox.style.display = 'block';
            dialogueBox.innerHTML = '';
            clearTimeout(typeTimeout);
            clearTimeout(hideTimeout);
            
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    dialogueBox.innerHTML += text.charAt(i);
                    i++;
                    typeTimeout = setTimeout(typeWriter, 35);
                } else {
                    hideTimeout = setTimeout(() => {
                        dialogueBox.style.display = 'none';
                    }, 5000);
                }
            }
            typeWriter();
        }

        function triggerBounce(element) {
            element.classList.remove('bounce-center');
            void element.offsetWidth; 
            element.classList.add('bounce-center');
        }

        function throwConfetti() {
            const colors = ['#f48fb1', '#ce93d8', '#fffacd', '#e1bee7', '#ffffff'];
            for (let i = 0; i < 50; i++) {
                let conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + '%';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                document.getElementById('game-container').appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }
        }

        function throwDrumsticks() {
            for (let i = 0; i < 30; i++) {
                let stick = document.createElement('div');
                stick.classList.add('drumstick');
                stick.style.left = Math.random() * 100 + '%';
                stick.style.animationDuration = (Math.random() * 1.5 + 1.0) + 's';
                document.getElementById('game-container').appendChild(stick);
                setTimeout(() => stick.remove(), 2500);
            }
        }

        document.getElementById('book').addEventListener('click', () => {
            showDialogue('Colossians 3:14: "And over all these virtues put on love, which binds them all together in perfect unity."');
            triggerBounce(document.getElementById('book'));
        });

        document.getElementById('cats').addEventListener('click', () => {
            showDialogue('meow, meow, Darius & Eveline <3');
            triggerBounce(document.getElementById('cats'));
        });

        let drumClicks = 0;
        let drumTimer;

        document.getElementById('drums').addEventListener('click', () => {
            triggerBounce(document.getElementById('drums'));
            drumClicks++;
            clearTimeout(drumTimer);

            if (drumClicks >= 5) {
                showDialogue('DA DUM TSSSS! DRUM SOLO!');
                throwDrumsticks();
                drumClicks = 0; 
            } else {
                showDialogue('da dum tssss.. congrats!!');
                drumTimer = setTimeout(() => { drumClicks = 0; }, 2000);
            }
        });

        document.getElementById('cake-container').addEventListener('click', () => {
            const flames = document.querySelectorAll('.flame');
            let isLit = false;
            
            flames.forEach(flame => {
                if (flame.style.display !== 'none') {
                    isLit = true;
                }
                flame.style.display = 'none';
            });

            if (isLit) {
                showDialogue('Make a wish!');
            } else {
                showDialogue('Time to cut the cake!');
            }
            
            triggerBounce(document.getElementById('cake-container'));
        });

        document.getElementById('couple').addEventListener('click', () => {
            throwConfetti();
            triggerBounce(document.getElementById('couple'));
        });
    </script>

</body>
</html>
